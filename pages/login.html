<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to your StudentHub student portal account." />
  <title>StudentHub | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/script.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="../index.html">
        <img src="../img/logo.jpg" alt="StudentHub logo" />
        <div class="brand-text">
          <strong>StudentHub</strong>
          <small>Student Management Portal</small>
        </div>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto me-3 gap-1">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="event.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a class="btn btn-outline-sh btn-sm" href="login.html">Login</a>
          <a class="btn btn-sh-primary btn-sm" href="register.html">Register</a>

        </div>
      </div>
    </div>
  </nav>

  <main class="container flex-grow-1">
    <section class="py-4">
      <div class="auth-panel">
        <img class="panel-logo" src="../img/logo.jpg" alt="StudentHub logo" />
        <h1 class="h4 fw-bold">Login</h1>
        <p class="subtext">Login to your StudentHub account</p>
        <form action="#" method="post">
          <div class="mb-3">
            <label for="login-id" class="form-label">Email / Username</label>
            <input type="text" class="form-control" id="login-id" name="login_id" autocomplete="username" required />
          </div>
          <div class="mb-3">
            <label for="login-password" class="form-label">Password</label>
            <input type="password" class="form-control" id="login-password" name="password" autocomplete="current-password" required />
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" name="remember" />
              <label class="form-check-label" for="remember">Remember Me</label>
            </div>
            <a href="forgot_password.html" class="small">Forgot Password?</a>
          </div>
          <button class="btn btn-sh-primary w-100 mb-3" type="submit">Login</button>
        </form>
        <p class="subtext text-center mb-0">Don't have an account? <a href="register.html">Register</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer py-3 mt-auto">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span class="text-secondary small">&copy; 2026 StudentHub. All rights reserved.</span>
      <nav class="d-flex gap-3 small">
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a href="feedback.html">Feedback</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
