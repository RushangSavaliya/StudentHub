<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Submit feedback for StudentHub." />
  <title>StudentHub | Feedback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/script.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="../index.html">
        <img src="../img/logo.jpg" alt="StudentHub logo" />
        <div class="brand-text">
          <strong>StudentHub</strong>
          <small>Student Management Portal</small>
        </div>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto me-3 gap-1">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="event.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link active" href="feedback.html" aria-current="page">Feedback</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a class="btn btn-outline-sh btn-sm" href="login.html">Login</a>
          <a class="btn btn-sh-primary btn-sm" href="register.html">Register</a>

        </div>
      </div>
    </div>
  </nav>

  <main class="container flex-grow-1">
    <nav aria-label="Breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Feedback</li>
      </ol>
    </nav>

    <section class="mb-4">
      <div class="section-title mb-3">
        <h4 class="fw-bold">Feedback</h4>
        <p>Your feedback helps us improve the StudentHub portal.</p>
      </div>
      <div class="card">
        <div class="card-body">
          <h5 class="card-title fw-bold mb-3">Feedback Form</h5>
          <form action="#" method="post">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="fb-name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fb-name" name="name" autocomplete="name" required />
              </div>
              <div class="col-md-6">
                <label for="fb-email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="fb-email" name="email" autocomplete="email" required />
              </div>
              <div class="col-12">
                <label for="rating" class="form-label">Overall Experience</label>
                <select class="form-select" id="rating" name="rating" required>
                  <option value="">Select a rating</option>
                  <option value="excellent">Excellent</option>
                  <option value="good">Good</option>
                  <option value="average">Average</option>
                  <option value="poor">Poor</option>
                </select>
              </div>
              <div class="col-12">
                <label for="feedback" class="form-label">Your Feedback</label>
                <textarea class="form-control" id="feedback" name="feedback" rows="5" required></textarea>
              </div>
              <div class="col-12">
                <div class="d-flex gap-2">
                  <input class="btn btn-sh-primary" type="submit" value="Submit Feedback" />
                  <input class="btn btn-outline-sh" type="reset" value="Clear" />
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer py-3 mt-auto">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span class="text-secondary small">&copy; 2026 StudentHub. All rights reserved.</span>
      <nav class="d-flex gap-3 small">
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a href="feedback.html">Feedback</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
