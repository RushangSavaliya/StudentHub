<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to your StudentHub student portal account." />
  <title>StudentHub | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/script.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg sticky-top bg-body border-bottom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-body" href="../index.html">
        <img src="../img/logo.jpg" alt="StudentHub logo" />
        <div>
          <div class="lh-1 fs-5">StudentHub</div>
          <small class="text-secondary fw-normal" style="font-size:0.75rem">Student Portal</small>
        </div>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto me-3 gap-1">
          <li class="nav-item"><a class="nav-link fw-semibold" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="event.html">Events</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="faq.html">FAQ</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="feedback.html">Feedback</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a class="btn btn-outline-secondary btn-sm rounded-pill px-3 active" href="login.html">Login</a>
          <a class="btn btn-primary btn-sm rounded-pill px-3" href="register.html">Register</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card p-4 p-md-5 rounded-4 shadow-lg border bg-body w-100" style="max-width: 440px;">
      <div class="text-center mb-4">
        <img class="rounded-4 border shadow-sm mx-auto mb-3" src="../img/logo.jpg" alt="StudentHub logo" style="width:68px;height:68px;object-fit:cover;" />
        <h2 class="fw-bold mb-1">Welcome Back</h2>
        <p class="text-secondary small">Sign in to your student or administrator portal</p>
      </div>

      <form action="student_dash.html" method="get">
        <div class="mb-3">
          <label for="login-id" class="form-label fw-semibold small"><i class="bi bi-person me-1"></i> Email or Student ID</label>
          <input type="text" class="form-control rounded-3" id="login-id" name="login_id" autocomplete="username" placeholder="e.g. student@example.com" required />
        </div>
        <div class="mb-3">
          <label for="login-password" class="form-label fw-semibold small"><i class="bi bi-lock me-1"></i> Password</label>
          <input type="password" class="form-control rounded-3" id="login-password" name="password" autocomplete="current-password" placeholder="Enter your password" required />
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" name="remember" />
            <label class="form-check-label small text-secondary" for="remember">Remember me</label>
          </div>
          <a href="forgot_password.html" class="small fw-semibold text-primary text-decoration-none">Forgot password?</a>
        </div>
        <button class="btn btn-primary w-100 rounded-pill py-2 shadow-sm mb-3" type="submit">Sign In &rarr;</button>
      </form>

      <div class="text-center pt-3 border-top">
        <p class="small text-secondary mb-0">Don't have an account? <a href="register.html" class="fw-bold text-primary text-decoration-none">Create an account</a></p>
      </div>
    </div>
  </main>

  <footer class="border-top py-3 mt-auto bg-body">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span class="text-secondary small">&copy; 2026 StudentHub. All rights reserved.</span>
      <nav class="d-flex gap-3 small">
        <a href="contact.html" class="text-secondary text-decoration-none">Contact</a>
        <a href="faq.html" class="text-secondary text-decoration-none">FAQ</a>
        <a href="feedback.html" class="text-secondary text-decoration-none">Feedback</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
